name: Fork-only PR 65022 Windows test

on:
  push:
    branches:
      - smoke/pr65022-windows

permissions:
  contents: read

jobs:
  tests:
    if: github.repository == 'live1206/azure-sdk-for-net' && github.ref == 'refs/heads/smoke/pr65022-windows'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
      - name: Run updater and approval regression tests on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Command npm -All | Select-Object Name, CommandType, Source | Format-Table -AutoSize
          . ./eng/common/scripts/Helpers/PSModule-Helpers.ps1
          Install-ModuleIfNotInstalled 'Pester' '5.7.1' | Import-Module
          $result = Invoke-Pester -Path ./eng/scripts/tests/Update-MgmtGeneratorDependency.Tests.ps1,./eng/scripts/tests/Mgmt-Dependency-Pipeline.Tests.ps1 -Tag UnitTest -Output Detailed -PassThru
          if ($result.FailedCount -gt 0 -or $result.FailedContainersCount -gt 0 -or $result.TotalCount -eq 0) {
            throw 'Windows updater regression tests failed or were not discovered.'
          }
          $global:LASTEXITCODE = 0
